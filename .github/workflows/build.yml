name: Build Better Hardcore

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: betterhardcore-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'
      - name: Run tests and build mod
        run: gradle --no-daemon clean test build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: BetterHardcore-1.19.2-Forge-43.5.0
          path: build/libs/*.jar
