name: Build Better Hardcore

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: betterhardcore-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Java and Gradle Wrapper
        run: |
          java -version
          ./gradlew --version
      - name: Run all tests and build the mod
        run: ./gradlew --no-daemon --stacktrace --info clean test build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: BetterHardcore-1.19.2-Forge-43.5.0
          path: build/libs/BetterHardcore-*.jar
          if-no-files-found: error
